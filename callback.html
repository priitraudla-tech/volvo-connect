<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Volvo Connect – sign-in callback</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; max-width: 560px; margin: 64px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 20px; font-weight: 600; }
  p { line-height: 1.5; }
  code { display: block; word-break: break-all; background: #f3f3f3; padding: 12px; border-radius: 6px; font-size: 13px; }
  button { margin-top: 12px; padding: 8px 16px; border: 1px solid #1a1a1a; background: #fff; border-radius: 6px; cursor: pointer; }
  .err { color: #b00020; }
</style>
</head>
<body>
<h1>Volvo Connect</h1>
<p id="msg">Processing sign-in…</p>
<div id="box" hidden>
  <code id="code"></code>
  <button id="copy" type="button">Copy code</button>
</div>
<script>
  (function () {
    var q = new URLSearchParams(window.location.search);
    var msg = document.getElementById('msg');
    if (q.get('error')) {
      msg.className = 'err';
      msg.textContent = 'Sign-in failed: ' + q.get('error') + (q.get('error_description') ? ' – ' + q.get('error_description') : '');
      return;
    }
    var code = q.get('code');
    var state = q.get('state') || '';
    if (!code) { msg.textContent = 'No authorisation code in the address.'; return; }
    // Sign-in started by the owner's local helper: hand the code to it on this computer.
    var m = state.match(/^local-(\d{4,5})-/);
    if (m) {
      msg.textContent = 'Sending the sign-in to the local helper…';
      window.location.replace('http://127.0.0.1:' + m[1] + '/callback' + window.location.search);
      return;
    }
    msg.textContent = 'Sign-in succeeded. Copy this code into the local helper:';
    document.getElementById('code').textContent = code;
    document.getElementById('box').hidden = false;
    document.getElementById('copy').onclick = function () {
      navigator.clipboard.writeText(code).then(function () { document.getElementById('copy').textContent = 'Copied'; });
    };
  })();
</script>
</body>
</html>
